# OpenTelemetry Collector contrib — Claude Code → ADLS Gen2 (JSONL)
#
# Production: replace azureblob exporter auth with managed identity /
# workload identity. Local: Azurite + connection string from .env.
#
# Dual write: azureblob (primary) + file (fallback for debugging).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 10s

  attributes/enrich:
    actions:
      - key: org.id
        value: ${env:ORG_ID}
        action: upsert
      - key: pipeline.environment
        value: ${env:ENVIRONMENT}
        action: upsert
      - key: pipeline.source
        value: claude_code
        action: upsert

  # Drop noisy high-volume metrics if you only need logs for compliance
  filter/keep_claude_events:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["event.name"] == nil and body == nil'

exporters:
  # Primary lakehouse landing — Azure Blob / ADLS Gen2
  # Container path pattern includes date partitions via template
  azureblob/bronze:
    # Auth: connection string for Azurite/dev; use managed identity in prod
    connection_string: ${env:AZURE_STORAGE_CONNECTION_STRING}
    container: ${env:AZURE_STORAGE_CONTAINER}
    blob_name_format: "${env:ADLS_BRONZE_PREFIX}/year=%Y/month=%m/day=%d/hour=%H/otel-logs-%Y%m%dT%H%M%S.jsonl"
    # Serialize each log record as one JSON line
    encodings:
      jsonl:
        encoding.json.type: otlp_json
    encoding: jsonl

  # Local fallback while iterating without Azure
  file/fallback:
    path: /var/otel/fallback/claude-code-otel.jsonl
    rotation:
      max_megabytes: 100
      max_days: 3
      max_backups: 5

  # Debug
  debug:
    verbosity: basic

  # Optional: Prometheus scrape for collector health
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/enrich, batch]
      exporters: [azureblob/bronze, file/fallback]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/enrich, batch]
      exporters: [azureblob/bronze, prometheus]
    # Traces optional — enable when CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/enrich, batch]
      exporters: [azureblob/bronze, debug]

  telemetry:
    metrics:
      address: 0.0.0.0:8888
